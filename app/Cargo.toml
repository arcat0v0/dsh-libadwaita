[package]
name = "dsh-libadwaita"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk4 = "0.10"
libadwaita = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
