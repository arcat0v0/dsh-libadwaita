[package]
name = "dsh-libadwaita"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk4 = "0.10"
libadwaita = { version = "0.8", features = ["v1_4", "v1_5", "v1_6"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
pulldown-cmark = "0.13"
sourceview5 = "0.10"

[dev-dependencies]
tempfile = "3"
